<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserve a Table — Fixed Form</title>
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/custom.css">
</head>
<body style="background-color: #F8FAFC; min-height: 100vh; padding: 30px 12px;">

  <div class="task3-wrapper">
    
    <div class="text-center mb-4">
      <h1 class="fw-bold h2 mb-2">Reserve a Table (Fixed Form)</h1>
      <p class="text-muted small">Fixed usability, accessibility (WCAG 2.1), and W3C Markup Validator compliance.</p>
    </div>

    <!-- Rebuilt Accessible Bootstrap Form -->
    <div class="task3-card mb-5">
      <form action="#" method="post">
        
        <div class="row g-3">
          
          <!-- 1. Full name -->
          <div class="col-12 col-sm-6">
            <label for="resName" class="form-label fw-semibold small">Your Name <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="resName" name="customerName" placeholder="Your name" required autocomplete="name">
          </div>

          <!-- 2. Email -->
          <div class="col-12 col-sm-6">
            <label for="resEmail" class="form-label fw-semibold small">Email Address <span class="text-danger">*</span></label>
            <input type="email" class="form-control" id="resEmail" name="customerEmail" placeholder="Email" required autocomplete="email">
          </div>

          <!-- 3. Phone -->
          <div class="col-12 col-sm-6">
            <label for="resPhone" class="form-label fw-semibold small">Phone <span class="text-danger">*</span></label>
            <input type="tel" class="form-control" id="resPhone" name="phone" placeholder="Phone" required autocomplete="tel">
          </div>

          <!-- 4. Guests -->
          <div class="col-12 col-sm-6">
            <label for="resGuests" class="form-label fw-semibold small">Guests <span class="text-danger">*</span></label>
            <input type="number" class="form-control" id="resGuests" name="guests" min="1" max="30" step="1" value="2" required>
          </div>

          <!-- 5. Date -->
          <div class="col-12 col-sm-6">
            <label for="resDate" class="form-label fw-semibold small">Date <span class="text-danger">*</span></label>
            <input type="date" class="form-control" id="resDate" name="date" required>
          </div>

          <!-- 6. Meal Slot (Select) -->
          <div class="col-12 col-sm-6">
            <label for="resMealSlot" class="form-label fw-semibold small">Meal <span class="text-danger">*</span></label>
            <select class="form-select" id="resMealSlot" name="meal" required>
              <option value="" disabled selected hidden>Choose...</option>
              <option value="Lunch">Lunch</option>
              <option value="Dinner">Dinner</option>
            </select>
          </div>

          <!-- 7. Seating Radio Group (Inside / Terrace) -->
          <div class="col-12">
            <fieldset>
              <legend class="form-label fw-semibold small mb-2 pt-0">Seating:</legend>
              <div class="d-flex flex-wrap gap-4">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="seating" id="seatingInside" value="Inside" checked required>
                  <label class="form-check-label" for="seatingInside">Inside</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="seating" id="seatingTerrace" value="Terrace" required>
                  <label class="form-check-label" for="seatingTerrace">Terrace</label>
                </div>
              </div>
            </fieldset>
          </div>

          <!-- 8. Comments -->
          <div class="col-12">
            <label for="resComments" class="form-label fw-semibold small">Comments</label>
            <textarea class="form-control" id="resComments" name="comments" rows="3" placeholder="Comments"></textarea>
          </div>

          <!-- 9. Terms Checkbox -->
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="resTerms" name="terms" required>
              <label class="form-check-label small fw-semibold" for="resTerms">
                I agree to the terms <span class="text-danger">*</span>
              </label>
            </div>
          </div>

          <!-- 10. Reserve Button -->
          <div class="col-12 mt-4 text-end">
            <button type="submit" class="btn btn-primary rounded-pill px-5 fw-bold shadow-sm">Reserve</button>
          </div>

        </div>

      </form>
    </div>

  </div>

</body>
</html>
